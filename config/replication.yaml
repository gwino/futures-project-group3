# Settings for src/replicate_regressions.py: the CL intraday momentum regressions of Baltussen, Da,
# Lammers & Martens (2021), Eqs. (5)-(9), on the 2021-2026 return features (#29).

features: data/processed/cl_return_features.parquet
# Inputs for the alternative roll rule: reference prices are rebuilt from the held and next listed
# contracts' minute bars under the existing 3-sessions-before-expiry calendar (#17/#18).
reference_config: config/prepare_minute.yaml
front_minutes: data/processed/cl_minute_front_contracts.parquet
roll_comparison: data/processed/cl_minute_roll_comparison.csv
return_config: config/return_features.yaml
tables_dir: reports/tables
figures_dir: reports/figures

target: r_lh
models:
  # name: predictors; every model has an intercept.
  onfh: [r_onfh]                  # Eq. (5)
  onfh_m_slh: [r_onfh, r_m, r_slh]  # Eq. (6)
  rod: [r_rod]                    # Eq. (7)
# Slopes, standard errors, adjusted R2 and OOS R2 are reported multiplied by 100, as in the paper.
scale: 100

inference:
  # Newey-West (1986) standard errors, Bartlett kernel, with the n / (n - k) small-sample correction.
  # The paper uses Newey-West for individual contracts but does not state the lag length; "auto" is
  # floor(4 (n / 100)^(2/9)), 7 for 1,436 observations. Other lags are reported as robustness.
  hac_lags: auto
  sensitivity_lags: [0, 1, 5, 10, 20]
  confidence: 0.95

oos:
  # Expanding-window forecasts after the paper's minimum of 500 observations, against the expanding
  # historical mean of the target (Eq. 8), with the Clark-West (2007) test (Eq. 9).
  min_train_obs: 500
  sensitivity_min_train: [250, 500, 750, 1000]

rolling:
  # Rolling-window estimates for the figures (about one trading year).
  window: 252

robustness:
  # Each variant re-estimates every model without the sample dates that match its rule: a boolean
  # column (true is dropped), a column at_most / above a value, or |column| above a sample quantile.
  # The HAC lag variants and the pre-expiry roll rule are added by the script.
  exclude_roll_dates: {column: roll_flag}
  exclude_degraded_dates: {column: degraded_date}
  exclude_expiry_adjacent: {column: sessions_to_expiry, at_most: 3}
  exclude_after_non_trading_days: {column: gap_days, above: 1}
  exclude_extreme_rod: {column: r_rod, abs_quantile_above: 0.99}

paper:
  # Appendix Table B3, Panel B, CL: 1987-01-06 to 2020-05-01, 8,336 days, 09:00-14:30 ET (08:00-13:30 CT).
  # Slopes x 100 with Newey-West t-statistics; adjusted R2 and OOS R2 in percent.
  sample: "1987-01-06 to 2020-05-01"
  observations: 8336
  onfh:
    coefficients: {r_onfh: [2.00, 0.72]}
    adj_r2: 0.17
    oos_r2: -0.48
  onfh_m_slh:
    coefficients: {r_onfh: [2.40, 1.12], r_m: [-0.06, -0.03], r_slh: [-13.95, -0.99]}
    adj_r2: 1.25
    oos_r2: -1.77
  rod:
    coefficients: {r_rod: [0.67, 0.25]}
    adj_r2: 0.03
    oos_r2: -1.04
