# Full electronic-session 1-minute bars for every CL.FUT instrument, filling the 2021-2024 gap (#26).
# Starts 2020-12-01 so the first 2021 session has a prior 13:30 CT reference close and a roll before it.
# The end is exclusive and equals the start of config/intraday.yaml, so the two files neither overlap nor leave a gap.
dataset: GLBX.MDP3
schema: ohlcv-1m
symbols: CL.FUT
stype_in: parent
start: "2020-12-01"
end: "2025-01-01"
output: data/raw/crude_oil_2021_2024_1m.dbn
