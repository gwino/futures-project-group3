# Settings for src/prepare_daily_data.py.
# Session and roll values are proposals pending #4 (Scope decisions).

input: data/raw/crude_oil_all_daily.dbn
# Databento continuous series (CL.v.0 volume roll, CL.c.0 calendar roll), used only as a cross-check.
continuous_check: data/raw/crude_oil_continuous_daily.dbn
output_dir: data/processed

session:
  timezone: America/Chicago
  # Databento ohlcv-1d bars cover UTC calendar days. Each bar is assigned to the CME trade date
  # with the same calendar date; bars dated on weekends or CME holidays (early-halt sessions
  # whose trades settle on the next trade date) are folded into the next trade date.
  close_time: "16:00"   # Globex daily halt; used to timestamp each daily bar
  fold_non_trading_days: true
  # CME holidays without a CL settlement. Juneteenth has been a CME holiday since 2022.
  juneteenth_from: "2022-06-19"

contracts:
  # Outright WTI contracts only: month code plus a one- or two-digit year (e.g. CLZ9, CLZ30).
  symbol_pattern: "^CL[FGHJKMNQUVXZ][0-9]{1,2}$"

roll:
  # days_before_expiry: hold the nearest contract until `days_before_expiry` trade dates before
  #   its last trade date, then switch to the next contract at that date's session.
  # volume_crossover: switch the session after the next contract's volume first exceeds the
  #   held contract's volume, but no later than `days_before_expiry` trade dates before expiry.
  rule: days_before_expiry
  days_before_expiry: 3
  adjustment: additive   # additive (difference) back-adjustment; ratio is unsafe with April 2020 negative prices

quality:
  # Flag a close-to-close change as an outlier when it exceeds this multiple of the
  # contract's rolling median absolute change. Flags are reported, never removed.
  outlier_window: 60
  outlier_threshold: 12

# Dates reported as "degraded" by Databento metadata.get_dataset_condition for GLBX.MDP3
