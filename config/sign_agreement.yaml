# Settings for src/analyze_sign_agreement.py: does agreement or disagreement between the overnight (ON)
# and daytime (DAY) return directions change last-half-hour (LH) momentum on CL (#33)?

return_features: data/processed/cl_return_features.parquet
reference_prices: data/processed/cl_minute_reference_prices.parquet
front_minutes: data/processed/cl_minute_front_contracts.parquet
# Inputs for the alternative roll rule, as in #29 and #31: return features rebuilt from the minute bars
# under the existing 3-sessions-before-expiry calendar (#17/#18).
reference_config: config/prepare_minute.yaml
roll_comparison: data/processed/cl_minute_roll_comparison.csv
return_config: config/return_features.yaml
# Execution, cost and evaluation settings of the strategy backtest (#30) are reused for the trading
# comparison, so the sign-filtered strategies are priced exactly like the baseline sign-of-ROD strategy.
strategy_config: config/lh_strategy.yaml
tables_dir: reports/tables
figures_dir: reports/figures

# Simple returns, as in the paper. The log version is reported as a labeled robustness variant.
target: r_lh
components: {"on": r_on, day: r_day}   # quoted: YAML reads a bare on as true
rod: r_rod
log_variant: {target: log_lh, components: {"on": log_on, day: log_day}, rod: log_rod}
# Slopes, standard errors and R2 are reported multiplied by 100, as in the paper.
scale: 100

inference:
  # Newey-West standard errors with the n / (n - k) correction; "auto" is floor(4 (n / 100)^(2/9)) as in #29.
  hac_lags: auto
  confidence: 0.95

categories:
  # The four sign combinations of (ON, DAY) known at 13:00 CT. Days on which either return is exactly
  # zero (a handful) are reported separately and left out of every group comparison and regression;
  # the include_zero_return_days robustness variant codes them as agree = 0 instead.
  agree: ["ON+/DAY+", "ON-/DAY-"]
  disagree: ["ON+/DAY-", "ON-/DAY+"]

grid:
  # The continuous view of coherence: ON and DAY as a two-dimensional vector. Each component is cut
  # into signed quantile bins (terciles by default) and the mean LH is reported per cell with its
  # standard error, so agreement is read off the diagonal and disagreement off the anti-diagonal
  # without a fixed threshold. Cells with fewer than min_cell dates are shown but flagged.
  bins: 3
  min_cell: 30

models:
  # Regressions of LH on 13:00 CT information, every one with an intercept. `agree` is 1 when the
  # ON and DAY signs match. The product ON x DAY is positive on every agreement day whatever the common
  # direction, so its slope measures a nonlinear (sign-symmetric) dependence of LH on the (ON, DAY)
  # vector; the directional claim rests on sign(ROD) x LH and the agreement interactions.
  rod: [rod]
  rod_by_agreement: [rod, agree, rod_x_agree]
  on_day: ["on", day]
  on_day_product: ["on", day, on_x_day]
  on_day_by_agreement: ["on", day, agree, on_x_agree, day_x_agree]
# Nested pairs for the out-of-sample comparison (larger model, model it nests).
nested: [[rod_by_agreement, rod], [on_day_product, on_day], [on_day_by_agreement, on_day]]

strategies:
  # Positions over 13:00-13:30 CT from signs known at 13:00. rod is the #30 baseline.
  rod: {rule: sign_of_rod}
  agree_only: {rule: sign_of_rod, when: agree}          # paper's eta(r_ONFH, r_ROD) idea applied to ON/DAY
  disagree_only: {rule: sign_of_rod, when: disagree}
  day_sign: {rule: sign_of_day}
  on_sign: {rule: sign_of_on}
baseline_strategy: rod

oos:
  # Expanding-window forecasts after the paper's minimum of 500 observations (first forecast 2023-01-04),
  # against the historical mean and against the nested model (Clark-West), as in #29 and #32.
  min_train_obs: 500

robustness:
  # Each variant reruns the group comparison and every model without the matching dates, with the
  # expanding-window OOS statistics (the exclusions are known in advance, so the forecasts stay
  # prospective). The script adds the pre-expiry roll rule, log returns and the zero-day coding.
  exclude_2026_03_10: {dates: ["2026-03-10"]}
  exclude_2022_and_2026: {years: [2022, 2026]}
  exclude_roll_dates: {column: roll_flag}
  exclude_degraded_dates: {column: degraded_date}
  exclude_after_non_trading_days: {column: gap_days, above: 1}

# Five defined comparisons, fixed when the script was written and before its results were read, but not
# registered outside this repository: the agree-vs-disagree strategy return, the ROD x agree slope, the
# ON x DAY product slope, and the two ON/DAY x agree slopes. The Bonferroni level is reported next to
# each p-value as an exploratory correction.
family_tests: 5
family_level: 0.05
